<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48">
  <defs>
    <!-- Classic Pac-Man Cherry (Level 1 Bonus) -->
    <g id="fruit-cherry">
      <!-- Stems -->
      <path d="M 0,-14 Q 5,-14 9,-7" stroke="#38A169" stroke-width="2" fill="none" stroke-linecap="round"/>
      <path d="M 0,-14 Q -2,-6 -7,-2" stroke="#38A169" stroke-width="2" fill="none" stroke-linecap="round"/>
      <rect x="-1.5" y="-16" width="3" height="3" rx="1" fill="#78350F"/>
      <!-- Left Cherry -->
      <circle cx="-8" cy="4" r="7" fill="#DC2626"/>
      <circle cx="-10" cy="2" r="2" fill="#FCA5A5"/>
      <!-- Right Cherry -->
      <circle cx="8" cy="2" r="7" fill="#DC2626"/>
      <circle cx="6" cy="0" r="2" fill="#FCA5A5"/>
    </g>

    <!-- Classic Strawberry (Level 2 Bonus) -->
    <g id="fruit-strawberry">
      <!-- Leaves -->
      <path d="M 0,-12 C -6,-12 -8,-8 -8,-8 C -4,-6 0,-8 0,-8 C 0,-8 4,-6 8,-8 C 8,-8 6,-12 0,-12 Z" fill="#22C55E"/>
      <rect x="-1" y="-15" width="2" height="3.5" fill="#15803D"/>
      <!-- Body -->
      <path d="M -8,-6 C -9,2 -4,11 0,14 C 4,11 9,2 8,-6 Z" fill="#EF4444"/>
      <!-- Seeds -->
      <circle cx="-3" cy="-2" r="0.9" fill="#FEF08A"/>
      <circle cx="3" cy="-2" r="0.9" fill="#FEF08A"/>
      <circle cx="0" cy="3" r="0.9" fill="#FEF08A"/>
      <circle cx="-3" cy="7" r="0.8" fill="#FEF08A"/>
      <circle cx="3" cy="7" r="0.8" fill="#FEF08A"/>
    </g>
  </defs>
  
  <use href="#fruit-cherry" x="0" y="0"/>
</svg>
