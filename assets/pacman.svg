<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48">
  <defs>
    <!-- Pacman Def for reuse (Hardware-optimized zero-filter neon halo) -->
    <g id="pacman-character">
      <!-- Lightweight Neon Aura -->
      <circle cx="0" cy="0" r="18" fill="#FFE600" opacity="0.12"/>
      <circle cx="0" cy="0" r="16" fill="#FFE600" opacity="0.22"/>
      
      <!-- Upper Jaw -->
      <path d="M 0,0 L 16,0 A 16 16 0 0,0 -16,0 L 0,0 Z" fill="#FFE600">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 0 0; -35 0 0; 0 0 0"
          dur="0.28s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
        />
      </path>
      
      <!-- Lower Jaw -->
      <path d="M 0,0 L -16,0 A 16 16 0 0,0 16,0 L 0,0 Z" fill="#FFE600">
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="0 0 0; 35 0 0; 0 0 0"
          dur="0.28s"
          repeatCount="indefinite"
          calcMode="spline"
          keySplines="0.4 0 0.2 1; 0.4 0 0.2 1"
        />
      </path>
      
      <!-- Subtle arcade glossy highlight -->
      <circle cx="-3" cy="-7" r="3.5" fill="#FFFBEB" opacity="0.55"/>
      <circle cx="4" cy="-5" r="1.5" fill="#FFFBEB" opacity="0.4"/>
    </g>
  </defs>
  
  <use href="#pacman-character" x="0" y="0"/>
</svg>
