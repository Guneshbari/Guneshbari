<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48">
  <defs>
    <!-- Base Ghost Eyes (Facing Right by default) -->
    <g id="ghost-eyes-right">
      <ellipse cx="-4" cy="-3" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="-2" cy="-3" r="2.5" fill="#1E3A8A"/>
      <circle cx="-1" cy="-4.5" r="0.9" fill="#FFFFFF"/>
      <ellipse cx="7" cy="-3" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="9" cy="-3" r="2.5" fill="#1E3A8A"/>
      <circle cx="10" cy="-4.5" r="0.9" fill="#FFFFFF"/>
    </g>

    <!-- Base Ghost Eyes (Facing Left) -->
    <g id="ghost-eyes-left">
      <ellipse cx="-7" cy="-3" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="-9" cy="-3" r="2.5" fill="#1E3A8A"/>
      <circle cx="-10" cy="-4.5" r="0.9" fill="#FFFFFF"/>
      <ellipse cx="4" cy="-3" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="2" cy="-3" r="2.5" fill="#1E3A8A"/>
      <circle cx="1" cy="-4.5" r="0.9" fill="#FFFFFF"/>
    </g>

    <!-- Frightened Face Overlay -->
    <g id="ghost-frightened-face">
      <!-- Frightened Eyes -->
      <circle cx="-5" cy="-3" r="2.2" fill="#FEF08A"/>
      <circle cx="5" cy="-3" r="2.2" fill="#FEF08A"/>
      <!-- Squiggly Mouth -->
      <path d="M -9,5 L -6,2 L -3,5 L 0,2 L 3,5 L 6,2 L 9,5" stroke="#FEF08A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Blinky (Red Ghost) with Timed Power Mode Flash -->
    <g id="ghost-blinky">
      <!-- Normal Mode Group -->
      <g>
        <animate attributeName="opacity" values="1; 1; 0; 0; 1; 1; 0; 0; 1" keyTimes="0; 0.22; 0.23; 0.48; 0.50; 0.68; 0.69; 0.93; 0.95" dur="12s" repeatCount="indefinite"/>
        <g class="ghost-glow">
          <path d="M -16,0 L -16,12 Q -11,16 -5.3,12 Q 0,8 5.3,12 Q 11,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z" fill="#EF4444" opacity="0.25" filter="url(#glow-blur)"/>
        </g>
        <path class="ghost-body" fill="#EF4444" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z">
          <animate
            attributeName="d"
            values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
            dur="0.32s"
            repeatCount="indefinite"
          />
        </path>
        <path d="M -13,-2 A 13 13 0 0,1 0,-13 L 0,-10 A 10 10 0 0,0 -10,-2 Z" fill="#FCA5A5" opacity="0.6"/>
        <use href="#ghost-eyes-right" class="ghost-eyes"/>
      </g>

      <!-- Frightened Mode Overlay -->
      <g>
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 1; 1; 0" keyTimes="0; 0.22; 0.23; 0.48; 0.50; 0.68; 0.69; 0.93; 0.95" dur="12s" repeatCount="indefinite"/>
        <path d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z" fill="#1D4ED8">
          <animate attributeName="fill" values="#1D4ED8;#1D4ED8;#FFFFFF;#1D4ED8;#FFFFFF;#1D4ED8" dur="3s" repeatCount="indefinite"/>
          <animate
            attributeName="d"
            values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
            dur="0.32s"
            repeatCount="indefinite"
          />
        </path>
        <use href="#ghost-frightened-face"/>
      </g>
    </g>

    <!-- Pinky (Pink Ghost) -->
    <g id="ghost-pinky">
      <g>
        <animate attributeName="opacity" values="1; 1; 0; 0; 1; 1; 0; 0; 1" keyTimes="0; 0.22; 0.23; 0.48; 0.50; 0.68; 0.69; 0.93; 0.95" dur="12s" repeatCount="indefinite"/>
        <g class="ghost-glow">
          <path d="M -16,0 L -16,12 Q -11,16 -5.3,12 Q 0,8 5.3,12 Q 11,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z" fill="#EC4899" opacity="0.25" filter="url(#glow-blur)"/>
        </g>
        <path class="ghost-body" fill="#EC4899" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z">
          <animate
            attributeName="d"
            values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
            dur="0.32s"
            repeatCount="indefinite"
          />
        </path>
        <path d="M -13,-2 A 13 13 0 0,1 0,-13 L 0,-10 A 10 10 0 0,0 -10,-2 Z" fill="#FBCFE8" opacity="0.65"/>
        <use href="#ghost-eyes-left" class="ghost-eyes"/>
      </g>

      <g>
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 1; 1; 0" keyTimes="0; 0.22; 0.23; 0.48; 0.50; 0.68; 0.69; 0.93; 0.95" dur="12s" repeatCount="indefinite"/>
        <path d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z" fill="#1D4ED8">
          <animate attributeName="fill" values="#1D4ED8;#1D4ED8;#FFFFFF;#1D4ED8;#FFFFFF;#1D4ED8" dur="3s" repeatCount="indefinite"/>
          <animate
            attributeName="d"
            values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
            dur="0.32s"
            repeatCount="indefinite"
          />
        </path>
        <use href="#ghost-frightened-face"/>
      </g>
    </g>

    <!-- Inky (Cyan Ghost) -->
    <g id="ghost-inky">
      <g>
        <animate attributeName="opacity" values="1; 1; 0; 0; 1; 1; 0; 0; 1" keyTimes="0; 0.22; 0.23; 0.48; 0.50; 0.68; 0.69; 0.93; 0.95" dur="12s" repeatCount="indefinite"/>
        <g class="ghost-glow">
          <path d="M -16,0 L -16,12 Q -11,16 -5.3,12 Q 0,8 5.3,12 Q 11,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z" fill="#06B6D4" opacity="0.25" filter="url(#glow-blur)"/>
        </g>
        <path class="ghost-body" fill="#06B6D4" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z">
          <animate
            attributeName="d"
            values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
            dur="0.32s"
            repeatCount="indefinite"
          />
        </path>
        <path d="M -13,-2 A 13 13 0 0,1 0,-13 L 0,-10 A 10 10 0 0,0 -10,-2 Z" fill="#A5F3FC" opacity="0.65"/>
        <use href="#ghost-eyes-right" class="ghost-eyes"/>
      </g>

      <g>
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 1; 1; 0" keyTimes="0; 0.22; 0.23; 0.48; 0.50; 0.68; 0.69; 0.93; 0.95" dur="12s" repeatCount="indefinite"/>
        <path d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z" fill="#1D4ED8">
          <animate attributeName="fill" values="#1D4ED8;#1D4ED8;#FFFFFF;#1D4ED8;#FFFFFF;#1D4ED8" dur="3s" repeatCount="indefinite"/>
          <animate
            attributeName="d"
            values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
            dur="0.32s"
            repeatCount="indefinite"
          />
        </path>
        <use href="#ghost-frightened-face"/>
      </g>
    </g>

    <!-- Clyde (Orange Ghost) -->
    <g id="ghost-clyde">
      <g>
        <animate attributeName="opacity" values="1; 1; 0; 0; 1; 1; 0; 0; 1" keyTimes="0; 0.22; 0.23; 0.48; 0.50; 0.68; 0.69; 0.93; 0.95" dur="12s" repeatCount="indefinite"/>
        <g class="ghost-glow">
          <path d="M -16,0 L -16,12 Q -11,16 -5.3,12 Q 0,8 5.3,12 Q 11,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z" fill="#F97316" opacity="0.25" filter="url(#glow-blur)"/>
        </g>
        <path class="ghost-body" fill="#F97316" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z">
          <animate
            attributeName="d"
            values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
            dur="0.32s"
            repeatCount="indefinite"
          />
        </path>
        <path d="M -13,-2 A 13 13 0 0,1 0,-13 L 0,-10 A 10 10 0 0,0 -10,-2 Z" fill="#FED7AA" opacity="0.65"/>
        <use href="#ghost-eyes-left" class="ghost-eyes"/>
      </g>

      <g>
        <animate attributeName="opacity" values="0; 0; 1; 1; 0; 0; 1; 1; 0" keyTimes="0; 0.22; 0.23; 0.48; 0.50; 0.68; 0.69; 0.93; 0.95" dur="12s" repeatCount="indefinite"/>
        <path d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z" fill="#1D4ED8">
          <animate attributeName="fill" values="#1D4ED8;#1D4ED8;#FFFFFF;#1D4ED8;#FFFFFF;#1D4ED8" dur="3s" repeatCount="indefinite"/>
          <animate
            attributeName="d"
            values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                    M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
            dur="0.32s"
            repeatCount="indefinite"
          />
        </path>
        <use href="#ghost-frightened-face"/>
      </g>
    </g>

    <!-- Standalone Frightened Definition -->
    <g id="ghost-frightened">
      <path class="ghost-scared-body" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z" fill="#1D4ED8">
        <animate
          attributeName="fill"
          values="#1D4ED8; #1D4ED8; #FFFFFF; #1D4ED8; #FFFFFF; #1D4ED8"
          dur="3s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="d"
          values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
          dur="0.32s"
          repeatCount="indefinite"
        />
      </path>
      <use href="#ghost-frightened-face"/>
    </g>
  </defs>
  
  <use href="#ghost-blinky" x="0" y="0"/>
</svg>
