<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -24 48 48">
  <defs>
    <!-- Base Ghost Eyes (Facing Right) -->
    <g id="ghost-eyes-right">
      <ellipse cx="-4" cy="-3" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="-2" cy="-3" r="2.5" fill="#1E3A8A"/>
      <circle cx="-1" cy="-4.5" r="0.9" fill="#FFFFFF"/>
      <ellipse cx="7" cy="-3" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="9" cy="-3" r="2.5" fill="#1E3A8A"/>
      <circle cx="10" cy="-4.5" r="0.9" fill="#FFFFFF"/>
    </g>

    <!-- Base Ghost Eyes (Facing Left) -->
    <g id="ghost-eyes-left">
      <ellipse cx="-7" cy="-3" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="-9" cy="-3" r="2.5" fill="#1E3A8A"/>
      <circle cx="-10" cy="-4.5" r="0.9" fill="#FFFFFF"/>
      <ellipse cx="4" cy="-3" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="2" cy="-3" r="2.5" fill="#1E3A8A"/>
      <circle cx="1" cy="-4.5" r="0.9" fill="#FFFFFF"/>
    </g>

    <!-- Base Ghost Eyes (Facing Up / Returning to House) -->
    <g id="ghost-eyes-up">
      <ellipse cx="-5.5" cy="-5" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="-5.5" cy="-7.5" r="2.5" fill="#1E3A8A"/>
      <circle cx="-4.5" cy="-8.5" r="0.9" fill="#FFFFFF"/>
      <ellipse cx="5.5" cy="-5" rx="4.5" ry="6" fill="#FFFFFF"/>
      <circle cx="5.5" cy="-7.5" r="2.5" fill="#1E3A8A"/>
      <circle cx="6.5" cy="-8.5" r="0.9" fill="#FFFFFF"/>
    </g>

    <!-- Frightened Face Overlay -->
    <g id="ghost-frightened-face">
      <circle cx="-5" cy="-3" r="2.2" fill="#FEF08A"/>
      <circle cx="5" cy="-3" r="2.2" fill="#FEF08A"/>
      <path d="M -9,5 L -6,2 L -3,5 L 0,2 L 3,5 L 6,2 L 9,5" stroke="#FEF08A" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Blinky (Red Ghost) -->
    <g id="ghost-blinky">
      <path class="ghost-glow" d="M -17,0 L -17,13 Q -11,17 -5.3,13 Q 0,9 5.3,13 Q 11,17 17,13 L 17,0 A 17 17 0 0,0 -17,0 Z" fill="#FF3B30" opacity="0.2"/>
      <path class="ghost-body" fill="#FF3B30" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z">
        <animate
          attributeName="d"
          values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
          dur="0.32s"
          repeatCount="indefinite"
        />
      </path>
      <path d="M -13,-2 A 13 13 0 0,1 0,-13 L 0,-10 A 10 10 0 0,0 -10,-2 Z" fill="#FCA5A5" opacity="0.6"/>
      <use href="#ghost-eyes-right" class="ghost-eyes"/>
    </g>

    <!-- Pinky (Pink Ghost) -->
    <g id="ghost-pinky">
      <path class="ghost-glow" d="M -17,0 L -17,13 Q -11,17 -5.3,13 Q 0,9 5.3,13 Q 11,17 17,13 L 17,0 A 17 17 0 0,0 -17,0 Z" fill="#FF69B4" opacity="0.2"/>
      <path class="ghost-body" fill="#FF69B4" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z">
        <animate
          attributeName="d"
          values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
          dur="0.32s"
          repeatCount="indefinite"
        />
      </path>
      <path d="M -13,-2 A 13 13 0 0,1 0,-13 L 0,-10 A 10 10 0 0,0 -10,-2 Z" fill="#FBCFE8" opacity="0.6"/>
      <use href="#ghost-eyes-left" class="ghost-eyes"/>
    </g>

    <!-- Inky (Cyan Ghost) -->
    <g id="ghost-inky">
      <path class="ghost-glow" d="M -17,0 L -17,13 Q -11,17 -5.3,13 Q 0,9 5.3,13 Q 11,17 17,13 L 17,0 A 17 17 0 0,0 -17,0 Z" fill="#00D8FF" opacity="0.2"/>
      <path class="ghost-body" fill="#00D8FF" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z">
        <animate
          attributeName="d"
          values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
          dur="0.32s"
          repeatCount="indefinite"
        />
      </path>
      <path d="M -13,-2 A 13 13 0 0,1 0,-13 L 0,-10 A 10 10 0 0,0 -10,-2 Z" fill="#BAE6FD" opacity="0.6"/>
      <use href="#ghost-eyes-right" class="ghost-eyes"/>
    </g>

    <!-- Clyde (Orange Ghost) -->
    <g id="ghost-clyde">
      <path class="ghost-glow" d="M -17,0 L -17,13 Q -11,17 -5.3,13 Q 0,9 5.3,13 Q 11,17 17,13 L 17,0 A 17 17 0 0,0 -17,0 Z" fill="#FF8C42" opacity="0.2"/>
      <path class="ghost-body" fill="#FF8C42" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z">
        <animate
          attributeName="d"
          values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
          dur="0.32s"
          repeatCount="indefinite"
        />
      </path>
      <path d="M -13,-2 A 13 13 0 0,1 0,-13 L 0,-10 A 10 10 0 0,0 -10,-2 Z" fill="#FED7AA" opacity="0.6"/>
      <use href="#ghost-eyes-left" class="ghost-eyes"/>
    </g>

    <!-- Frightened Blue Ghost (Power Pellet Mode) -->
    <g id="ghost-frightened">
      <path class="ghost-glow" d="M -17,0 L -17,13 Q -11,17 -5.3,13 Q 0,9 5.3,13 Q 11,17 17,13 L 17,0 A 17 17 0 0,0 -17,0 Z" fill="#1D4ED8" opacity="0.2"/>
      <path class="ghost-body" fill="#1D4ED8" d="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z">
        <animate
          attributeName="d"
          values="M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,14 Q -10.6,10 -5.3,14 Q 0,18 5.3,14 Q 10.6,10 16,14 L 16,0 A 16 16 0 0,0 -16,0 Z;
                  M -16,0 L -16,12 Q -10.6,16 -5.3,12 Q 0,8 5.3,12 Q 10.6,16 16,12 L 16,0 A 16 16 0 0,0 -16,0 Z"
          dur="0.32s"
          repeatCount="indefinite"
        />
        <animate
          attributeName="fill"
          values="#1D4ED8;#1D4ED8;#FFFFFF;#1D4ED8;#FFFFFF;#1D4ED8"
          keyTimes="0;0.70;0.78;0.86;0.94;1"
          dur="8s"
          repeatCount="indefinite"
        />
      </path>
      <use href="#ghost-frightened-face"/>
    </g>

    <!-- Eaten Ghost Eyes (Retreating to Ghost House) -->
    <g id="ghost-eaten-eyes">
      <use href="#ghost-eyes-up"/>
    </g>
  </defs>

  <use href="#ghost-blinky" x="0" y="0"/>
</svg>
