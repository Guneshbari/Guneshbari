<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 40 40">
  <defs>
    <!-- Standard Pellet -->
    <g id="pellet-standard">
      <circle cx="0" cy="0" r="3.5" fill="#FFD54A"/>
    </g>

    <!-- Power Pellet (Energizer) with lightweight hardware-accelerated pulse -->
    <g id="pellet-power">
      <!-- Glow Aura (Layered Opacity instead of GPU Blur Filter) -->
      <circle cx="0" cy="0" r="16" fill="#FFE600" opacity="0.25">
        <animate attributeName="r" values="14; 17; 14" dur="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.15; 0.35; 0.15" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <!-- Core Power Pellet -->
      <circle cx="0" cy="0" r="9" fill="#FFFBEB">
        <animate attributeName="r" values="8; 10; 8" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="7" fill="#FFE600">
        <animate attributeName="r" values="6.5; 8; 6.5" dur="0.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="-2.5" cy="-2.5" r="2" fill="#FFFFFF"/>
    </g>
  </defs>
  
  <use href="#pellet-power" x="0" y="0"/>
</svg>
